name: Build EstatePilot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract EstatePilot
        run: |
          unzip -q EstatePilot_Phase1_Source.zip
          test -f EstatePilot/pubspec.yaml

      - name: Fix Gradle Wrapper
        run: |
          flutter create --platforms=android --project-name wrapper_seed /tmp/wrapper_seed
          cp /tmp/wrapper_seed/android/gradlew EstatePilot/android/gradlew
          cp /tmp/wrapper_seed/android/gradlew.bat EstatePilot/android/gradlew.bat
          cp /tmp/wrapper_seed/android/gradle/wrapper/gradle-wrapper.jar EstatePilot/android/gradle/wrapper/gradle-wrapper.jar
          chmod +x EstatePilot/android/gradlew

      - name: Get Packages
        working-directory: EstatePilot
        run: flutter pub get

      - name: Build APK
        working-directory: EstatePilot
        run: flutter build apk --release

      - name: Rename APK
        run: cp EstatePilot/build/app/outputs/flutter-apk/app-release.apk EstatePilot.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EstatePilot-APK
          path: EstatePilot.apk
          if-no-files-found: error
        
